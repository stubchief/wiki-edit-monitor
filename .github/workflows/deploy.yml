name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Write Yandex Cloud key
        run: |
          mkdir -p deploy/terraform
          echo '${{ secrets.YC_KEY_JSON }}' > deploy/terraform/key.json

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo '${{ secrets.SSH_PRIVATE_KEY }}' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo '${{ secrets.SSH_PUBLIC_KEY }}' > ~/.ssh/id_rsa.pub

      - name: Terraform init
        working-directory: deploy/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_ssh_public_key_path: ~/.ssh/id_rsa.pub
        run: terraform init -backend-config="access_key=$AWS_ACCESS_KEY_ID" -backend-config="secret_key=$AWS_SECRET_ACCESS_KEY"

      - name: Terraform apply
        working-directory: deploy/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_ssh_public_key_path: ~/.ssh/id_rsa.pub
        run: terraform apply -auto-approve

      - name: Get VM IP
        id: vm_ip
        working-directory: deploy/terraform
        run: echo "ip=$(terraform output -raw vm_external_ip)" >> $GITHUB_OUTPUT

      - name: Wait for VM to be ready
        run: sleep 120

      - name: Deploy via SSH
        env:
          VM_IP: ${{ steps.vm_ip.outputs.ip }}
          CLICKHOUSE_PASSWORD: ${{ secrets.TF_VAR_clickhouse_password }}
          GRAFANA_PASSWORD: ${{ secrets.TF_VAR_grafana_password }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 ubuntu@$VM_IP             "sudo git clone https://github.com/stubchief/wiki-edit-monitor.git /opt/wiki-edit-monitor || (sudo git -C /opt/wiki-edit-monitor fetch origin && sudo git -C /opt/wiki-edit-monitor reset --hard origin/main) && sudo chown -R ubuntu:ubuntu /opt/wiki-edit-monitor &&             TF_VAR_clickhouse_password=$CLICKHOUSE_PASSWORD TF_VAR_grafana_password=$GRAFANA_PASSWORD             KUBECONFIG=/home/ubuntu/.kube/config             helmfile --file /opt/wiki-edit-monitor/helmfile.yaml.gotmpl sync"